name: Daily Pickleball Data Scraper

on:
  # schedule:
  #   - cron: '0 16 * * *' # 每天台灣時間凌晨0點 (UTC 16:00)
  workflow_dispatch: # 允許手動觸發

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai gspread google-auth

      - name: Run Shopify Scraper (Directly to Google Sheets)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python scripts/auto_scrape_shopify.py
