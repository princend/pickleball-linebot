name: Daily Pickleball Data Scraper

on:
  schedule:
    - cron: '0 16 * * *' # 每天台灣時間凌晨0點 (UTC 16:00)
  workflow_dispatch: # 允許手動觸發

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai gspread google-auth

      - name: Run Shopify Scraper (Directly to Google Sheets)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python scripts/auto_scrape_shopify.py

      - name: Run Events Scraper (Directly to Google Sheets)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python scripts/update_events.py

      - name: Run Courts Sync (Directly to Google Sheets)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          COURTS_SHEET_GID: "1386987707"
        run: |
          python scripts/update_courts.py --sync-only

      - name: Commit & Push updated data snapshot (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events_data.json data/events_for_sheet.csv data/courts_data.json data/courts_for_sheet.csv || true
          if git diff --staged --quiet; then
            echo "No data snapshot changes to commit"
          else
            git commit -m "chore: 定期自動更新賽事與球場快照資料 [skip ci]"
            git push || echo "Push skipped or not permitted"
          fi


