name: Auto Update Pickleball Data

on:
  schedule:
    # 每天台灣時間凌晨 04:00 執行 (UTC 時間 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch: # 允許手動在 GitHub 介面觸發

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run events scraper
        run: python scripts/update_events.py
        
      - name: Run courts scraper
        run: python scripts/update_courts.py
        
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code data/ || echo "changed=true" >> $GITHUB_OUTPUT
          
      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "Auto-update pickleball data (courts & events)"
          git push
